<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Draw Rectangle</title>
</head>
<body>
  <p>Keerthi Varadharaj| kevaradh@ucsc.edu</p>
  <p>Notes to Grader: I am sending files in Piazza instead of Canvas, as I'm not enrolled yet. Thank you!</p>
  <canvas id="example" width="400" height="400"
    style="background-color: black">

  </canvas>
  <br><br>
  <label>v1: X <input type="number" id="v1x" value="2.25"></label>
  <label> Y <input type="number" id="v1y" value="2.25"></label>

  <br><br>
  Operation:
  <select id="operation">
    <option value="add">Add</option>
    <option value="sub">Sub</option>
    <option value="mul">Mul</option>
    <option value="div">Div</option>
    <option value="magnitude">Magnitude</option>
    <option value="normalize">Normalize</option>
    <option value="angle">Angle Between</option>
    <option value="area">Area</option>
  </select>

  Scalar: <input type="number" id="scalar" value="2">
  <br>

  <button onclick="handleDrawOperationEvent()">Draw</button>
