<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Assignment 1</title>
  <style>
    button {
      background-color: white;
      border: 1px solid black;
      padding: 5px 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: lightgrey;
    }
  </style>
</head>
<body onload="main()">
  <canvas id="webgl" width="400" height="400">
    Please use a browser that supports canvas
  </canvas>
  <br>
  <br>
  <button onclick="clearCanvas()">Clear Canvas</button>

  <br><br>
  <b>Drawing Mode:</b><br>
  <button onclick="setShape('point')">Squares</button>
  <button onclick="setShape('triangle')">Triangles</button>
  <button onclick="setShape('circle')">Circles</button>
  <button onclick="drawMyPicture()">Draw Picture</button>
  <br><br>
  <b>Shape Color:</b><br>
  Red <input type="range" id="redSlider" min="0" max="255" value="255">
  Green <input type="range" id="greenSlider" min="0" max="255" value="0">
  Blue <input type="range" id="blueSlider" min="0" max="255" value="0">

  <br><br>
  <b>Shape Size:</b>
  <input type="range" id="sizeSlider" min="1" max="50" value="10">
  &nbsp;&nbsp;
  <b>(Circles) Segment Count:</b>
  <input type="range" id="segmentSlider" min="3" max="30" value="10">

  <script src="../lib/webgl-utils.js"></script>
  <script src="../lib/webgl-debug.js"></script>
  <script src="../lib/cuon-utils.js"></script>
  <script src="asgn1.js"></script>
</body>
</html>
